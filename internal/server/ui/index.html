<!DOCTYPE html>
<html lang="en">

<head>
  <title>DDNS Updater</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="static/favicon.svg" sizes="any" type="image/svg+xml">
  <link rel="icon" href="static/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="static/styles.css" type="text/css">
</head>

<body>
  <div class="toolbar">
    <button type="button" id="update-now" onclick="updateNow()">Update now</button>
    <button type="button" id="reload-config" onclick="reloadConfig()">Reload config</button>
    <label for="period-input">Period</label>
    <input type="text" id="period-input" placeholder="e.g. 1m" size="8">
    <button type="button" id="set-period" onclick="setPeriod()">Set period</button>
    <button type="button" id="live-toggle" onclick="toggleLive()" title="Automatically refresh the records">Live: off</button>
    <span id="status" class="status"></span>
  </div>
  <table role="table">
    <thead>
      <tr>
        <th>Domain</th>
        <th>Owner</th>
        <th>Provider</th>
        <th>IP Version</th>
        <th>Update Status</th>
        <th>Current IP</th>
        <th>Previous IPs<small> (reverse chronological order)</small></th>
      </tr>
    </thead>
    <tbody>
      {{range .Rows}}
      <tr>
        <td data-label="Domain">{{.Domain}}</td>
        <td data-label="Owner">{{.Owner}}</td>
        <td data-label="Provider">{{.Provider}}</td>
        <td data-label="IP Version">{{.IPVersion}}</td>
        <td data-label="Update Status">{{.Status}}</td>
        <td data-label="Current IP">{{.CurrentIP}}</td>
        <td data-label="Previous IPs">{{.PreviousIPs}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
  <footer>
    <div>
      <a href="https://github.com/qdm12/ddns-updater" class="text-big">
        <svg class="github-icon" height="1em" aria-hidden="true" viewBox="0 0 16 16" version="1.1"
          data-view-component="true">
          <path
            d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
          </path>
        </svg>
      </a>
    </div>
    <div>by <a href="https://github.com/qdm12">Quentin McGaw</a> / UI reworked by <a
        href="https://github.com/fuse314">Gottfried Mayer</a></div>
  </footer>
  <script>
    const liveInterval = 15000;
    const liveStorageKey = "ddns-updater-live";
    let liveTimer = null;

    function setStatus(message, isError) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.className = isError ? "status status-error" : "status";
    }

    async function request(path) {
      const response = await fetch(path);
      const text = await response.text();
      if (!response.ok) {
        throw new Error(text || response.statusText);
      }
      return text;
    }

    async function updateNow() {
      setStatus("Updating...", false);
      try {
        const message = await request("update");
        setStatus(message, false);
        await refreshTable();
      } catch (error) {
        setStatus("Update failed: " + error.message, true);
      }
    }

    async function reloadConfig() {
      setStatus("Reloading...", false);
      try {
        const message = await request("reload");
        setStatus(message, false);
        window.setTimeout(function () { window.location.reload(); }, 500);
      } catch (error) {
        setStatus("Reload failed: " + error.message, true);
      }
    }

    async function setPeriod() {
      const input = document.getElementById("period-input");
      const period = input.value.trim();
      if (!period) {
        setStatus("Please enter a period, for example 1m", true);
        return;
      }
      setStatus("Setting period...", false);
      try {
        const message = await request("reload?period=" + encodeURIComponent(period));
        setStatus(message, false);
        window.setTimeout(function () { window.location.reload(); }, 500);
      } catch (error) {
        setStatus("Failed to set period: " + error.message, true);
      }
    }

    function isLiveEnabled() {
      try {
        return window.localStorage.getItem(liveStorageKey) === "true";
      } catch (error) {
        return false;
      }
    }

    function updateLiveButton() {
      const button = document.getElementById("live-toggle");
      const enabled = isLiveEnabled();
      button.textContent = enabled ? "Live: on" : "Live: off";
      button.classList.toggle("active", enabled);
      button.setAttribute("aria-pressed", enabled ? "true" : "false");
    }

    function startLiveRefresh() {
      stopLiveRefresh();
      liveTimer = window.setInterval(refreshTable, liveInterval);
    }

    function stopLiveRefresh() {
      if (liveTimer !== null) {
        window.clearInterval(liveTimer);
        liveTimer = null;
      }
    }

    function setLiveEnabled(enabled) {
      try {
        window.localStorage.setItem(liveStorageKey, enabled ? "true" : "false");
      } catch (error) {
        // the browser may block local storage, the toggle still works for this page
      }
      updateLiveButton();
      if (enabled) {
        startLiveRefresh();
        refreshTable();
      } else {
        stopLiveRefresh();
      }
    }

    function toggleLive() {
      setLiveEnabled(!isLiveEnabled());
    }

    // Refresh only the records table, so that the toolbar and the period
    // input keep their state. The table is only replaced when its content
    // actually changed, so there is no flicker.
    async function refreshTable() {
      try {
        const response = await fetch(window.location.pathname, { cache: "no-store" });
        if (!response.ok) {
          return;
        }
        const html = await response.text();
        const parsed = new DOMParser().parseFromString(html, "text/html");
        const newRows = parsed.querySelector("tbody");
        const currentRows = document.querySelector("tbody");
        if (!newRows || !currentRows) {
          return;
        }
        if (newRows.innerHTML !== currentRows.innerHTML) {
          currentRows.innerHTML = newRows.innerHTML;
        }
      } catch (error) {
        // ignore the error, the next tick retries
      }
    }

    updateLiveButton();
    if (isLiveEnabled()) {
      startLiveRefresh();
    }
  </script>
</body>

</html>
